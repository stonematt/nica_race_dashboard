nt-size: 15px; line-height: 1.55;\">The frame answers \"is this kid moving\" from the data, every time, from scratch. It has no memory of the last conversation and does not try to have one.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 24px; flex-wrap: wrap; max-width: 1250px;\">\n    <div style=\"flex: 1 1 500px; border: 2px solid #FF8000; background: #405C80; color: #ffffff; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px;\">\n      <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">What this buys, and it's bigger than a screen<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55;\">Exactly one write path in the product — attaching a plate to a Rider. So: no audit trail, no moderation, no edit history, no role system beyond queue scoping, and <strong>no coach-authored text about a minor anywhere in the database<\u002Fstrong>. Twenty volunteer coaches and a roster of minors behind a magic link: declining to store written opinions about children is the single largest privacy simplification available to you, and you just took it. Worth an ADR of its own.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 400px; border: 2px solid #0d0d0d; background: #ffffff; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px;\">\n      <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">What it costs<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55;\">The coach's memory. Nothing carries between September and November except what a coach holds in their head. When someone eventually says <em>\"I wish I'd written down what we agreed on in September,\"<\u002Fem> that is the signal to revisit — and my read is that the right answer then is still Outspoke, because by then it's a coaching record, not a result.<\u002Fdiv>\n      <div style=\"font-size: 14px; line-height: 1.5; border-top: 2px solid #0d0d0d; padding-top: 10px;\"><strong>Sequencing effect:<\u002Fstrong> none. Nothing is added. Phase 3's gate just got sharper — the test is now \"can a coach read this aloud to a fourteen-year-old,\" which is a thing you can actually do in a driveway.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: #0d0d0d; margin: 8px 0 0;\"><\u002Fdiv>\n\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 6 · My call, and the sequence<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">Version C. The control stays inside the club tree; the crossing is a door.<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 900px; text-wrap: pretty;\">You handed me the choice, so here it is with the reasoning exposed — argue with any line of it. Two things are still genuinely open at the bottom, and one of them is \"discussion,\" which you've asked about twice and I have not answered.<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"6a\" style=\"border: 2px solid #FF8000; background: #ffffff; max-width: 1250px;\">\n    <div style=\"background: #405C80; color: #ffffff; padding: 16px 20px; display: flex; align-items: baseline; gap: 14px;\">\n      <span style=\"font-weight: 700; font-size: 17px;\">6a<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Why C and not B<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding: 20px; display: flex; gap: 24px; flex-wrap: wrap;\">\n      <div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">The deciding argument<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">A field is not rows. Route B's shape change is therefore inevitable — the only question is <em>where it happens<\u002Fem>. In B it happens on a segmented control, which had promised that every notch was the same view. In C it happens on a <strong>link<\u002Fstrong>, where a change of shape is exactly what a link is for. Same shape change, honest packaging.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">What C keeps from B<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">Squad ⇄ Club as a scope control on one wall. Both are rows of riders we own, so the control never lies, and it buys M1-for-the-Head-Coach and M3-across-squads for no new surface. That was B's real prize and it survives.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">The cost I'm accepting<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">Job story 9 — \"the Club placed against its conference in that same Round\" — has no home until later. That's a real loss and I'd rather name it than hide it. My read: of the M4 pair, story 9 is the one a coach tells other adults, and story 10's \"who's included\" worry is better served by one honest door than by a control that quietly changes what it means.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top: 2px solid #FF8000; padding: 16px 20px; font-size: 15px; line-height: 1.55; background: rgba(255, 128, 0, 0.15);\"><strong>The rule this yields, stated positively:<\u002Fstrong> the scope control moves you within a tree. A link moves you between trees. One representation each, and a coach can learn which is which in one sitting — <em>\"the buttons keep you home, the red link leaves.\"<\u002Fem><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"6b\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">6b<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">The persona cut: three depths, not three roles<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding: 16px 20px; font-size: 15px; line-height: 1.55; border-bottom: 2px solid #0d0d0d;\">Nobody gets a different app. One wall, and a role is a triple of defaults: <strong>where the scope control starts, whether the queue is visible, and how it's filtered.<\u002Fstrong> That's the whole difference, and it means you build one surface and configure it — which is also why an Assistant can be promoted mid-season without a migration.<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 150px 1fr 1fr 1fr;\">\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d;\"><\u002Fdiv>\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 2px solid #0d0d0d;\">Head Coach<\u002Fdiv>\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 2px solid #0d0d0d;\">Squad Leader<\u002Fdiv>\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 2px solid #0d0d0d;\">Assistant<\u002Fdiv>\n\n      <div style=\"padding: 12px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">Scope starts at<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\">Club — 25 rows, grouped by Squad<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\">Their Squad. Can widen to Club and read everything.<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\">The Squad they help with. Same widening.<\u002Fdiv>\n\n      <div style=\"padding: 12px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">The queue (M0)<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\">Unfiltered. Every unmapped plate on every Scoring Team the Club spans.<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\"><strong>Filtered to their Scoring Teams.<\u002Fstrong> The person closest to the riders does the recognising — this is the fan-out you asked about, and it costs one predicate.<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\">Not shown. No write, no banner, no ten seconds spent on someone else's job.<\u002Fdiv>\n\n      <div style=\"padding: 12px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">Ten-second read<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\">Club column filled in? Any dashed cells I didn't expect?<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\">My four rows across five columns.<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 2px solid #0d0d0d;\">Same wall. That <em>is<\u002Fem> the ten seconds.<\u002Fdiv>\n\n      <div style=\"padding: 12px 14px; font-size: 14px; font-weight: 700;\">Never sees<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-left: 2px solid #0d0d0d; color: #6e6e6e;\">Nothing withheld.<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-left: 2px solid #0d0d0d; color: #6e6e6e;\">Other squads' <em>queue items<\u002Fem> — but all of their results.<\u002Fdiv>\n      <div style=\"padding: 12px 14px; font-size: 14px; border-left: 2px solid #0d0d0d; color: #6e6e6e;\">The write path, anywhere.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top: 2px solid #0d0d0d; padding: 16px 20px; font-size: 15px; line-height: 1.55;\"><strong>Where the write moment sits — decided.<\u002Fstrong> Not a mode and not a separate intake screen. A queue, entered from a <strong>banner row pinned above the wall<\u002Fstrong>: \"3 plates from the Prologue aren't attached to a Rider.\" It appears on ingest, it is scoped by Scoring Team so it fans out, and <em>it disappears when drained<\u002Fem> — which is the property a banner has and a nav item doesn't. The queue itself is the one place in the app that looks like a form.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"6c\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">6c<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Sequencing — what has to exist before what<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column;\">\n      <div style=\"display: grid; grid-template-columns: 62px 1fr 1fr 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 14px 12px; font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400; background: #FF8000; color: #0d0d0d;\">0<\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 2px solid #0d0d0d;\"><div style=\"font-size: 16px; font-weight: 700; margin-bottom: 4px;\">The wall, Squad scope, read-only<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Rows × Rounds × three-state marks. The front door.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #6e6e6e; margin-bottom: 4px;\">Needs first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Season-keyed roster · Rounds enumerated for the Season · the did-not-start derivation (roster × rounds)<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #405C80; margin-bottom: 4px;\">Pays for<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">M3 whole · M1 for a Squad Leader<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 62px 1fr 1fr 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 14px 12px; font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400; background: #FF8000; color: #0d0d0d;\">1<\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 2px solid #0d0d0d;\"><div style=\"font-size: 16px; font-weight: 700; margin-bottom: 4px;\">Scope: Squad ⇄ Club<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">The same component, more rows, grouped by Squad.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #6e6e6e; margin-bottom: 4px;\">Needs first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Nothing new in the data. Scope in the URL, if deep links matter.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #405C80; margin-bottom: 4px;\">Pays for<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">M1 for the Head Coach. Cheapest large win in the plan — do it immediately, while it's still the same file.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 62px 1fr 1fr 1fr; border-bottom: 1px solid #e7e7e7; background: #faf9f4;\">\n        <div style=\"padding: 14px 12px; font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400; background: #0d0d0d; color: #ffffff;\">2<\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 2px solid #0d0d0d;\"><div style=\"font-size: 16px; font-weight: 700; margin-bottom: 4px;\">The queue (M0)<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Banner above the wall → attach plate to Rider, or create one.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #6e6e6e; margin-bottom: 4px;\">Needs first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Plate→Rider attach · Prior Name lookup · Scoring Team predicate for the fan-out<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #405C80; margin-bottom: 4px;\">Pays for<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">M0 · and the honesty of every number in phases 0–1<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 14px 20px 16px 74px; border-bottom: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15); font-size: 14px; line-height: 1.5;\"><strong>The real tension in this sequence, stated plainly.<\u002Fstrong> Phase 2 is the only write and the riskiest surface, which argues for late. But until it exists, the wall <em>under-counts the club<\u002Fem> — an unmapped plate is a rider who raced and doesn't appear — so phases 0 and 1 ship a front door with quietly wrong numbers. I've put it third rather than first because you can hold that line with a visible warning for a few weeks and you cannot hold \"there is no app\" for a few weeks. If you disagree, the swap is cheap: 2 → 0.<\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 62px 1fr 1fr 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 14px 12px; font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400; background: #0d0d0d; color: #ffffff;\">3<\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 2px solid #0d0d0d;\"><div style=\"font-size: 16px; font-weight: 700; margin-bottom: 4px;\">The rider frame<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Her season round by round, Prologue as point one.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #6e6e6e; margin-bottom: 4px;\">Needs first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Percent Back per Round · Start count as a first-class fact<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #405C80; margin-bottom: 4px;\">Gate before shipping<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Show it to a coach of a finish-oriented rider. If place dominates the frame, fix it here — this is the last cheap moment.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 62px 1fr 1fr 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 14px 12px; font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400; background: #0d0d0d; color: #ffffff;\">4<\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 2px solid #0d0d0d;\"><div style=\"font-size: 16px; font-weight: 700; margin-bottom: 4px;\">The crossing<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">One red link off the rider frame → her category field at that Round.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #6e6e6e; margin-bottom: 4px;\">Needs first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Category field per Round · an explicit \"who is in this comparison\" statement on the face of it<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #405C80; margin-bottom: 4px;\">Pays for<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">M4's rider half · story 10's \"reads as a filter, not a bug\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 62px 1fr 1fr 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 14px 12px; font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400; background: #6e6e6e; color: #ffffff;\">5<\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 2px solid #0d0d0d;\"><div style=\"font-size: 16px; font-weight: 700; margin-bottom: 4px;\">The season arc, and standings in place<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">The club's arc across Rounds; published totals shown verbatim beside it, never on the same axis.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #6e6e6e; margin-bottom: 4px;\">Needs first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Standings ingested · Level split handled, because a Middle School rider has a standing and no team result<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #405C80; margin-bottom: 4px;\">Pays for<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">M5, which has nothing today<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 62px 1fr 1fr 1fr;\">\n        <div style=\"padding: 14px 12px; font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400; background: #6e6e6e; color: #ffffff;\">6<\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 2px solid #0d0d0d;\"><div style=\"font-size: 16px; font-weight: 700; margin-bottom: 4px;\">Season close, and last season as baseline<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Switch the ambient Season and the same wall shows a different roster.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #6e6e6e; margin-bottom: 4px;\">Needs first<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">Nothing — <em>if<\u002Fem> Season has genuinely been the frame since phase 0. A migration, if it hasn't.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding: 14px 16px; border-left: 1px solid #e7e7e7;\"><div style=\"font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #405C80; margin-bottom: 4px;\">Pays for<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45;\">M6, never ticketed. This row is the argument for Rule 4 being structural in phase 0 rather than a discipline.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid #0d0d0d; background: #405C80; color: #ffffff; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; max-width: 1250px;\">\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400;\">Still open — I'm not going to decide these for you<\u002Fdiv>\n    <div style=\"display: flex; gap: 28px; flex-wrap: wrap;\">\n      <div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">1 · \"Discussion\"<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">Asked twice, unanswered. My position: <strong>(b) is yours and the other two are not.<\u002Fstrong> A coaching observation pinned to a Rider at a Round is analytics — it is the qualitative column beside Percent Back, and it's the only writable thing in the product besides an identity. A thread is Outspoke. A read-receipt is management. But this is your product and it changes the sequence, so it's a question.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">2 · Where Season lives<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">Phase 6 depends on this and phase 0 sets it. URL segment <em>and<\u002Fem> a persistent selector is the only combination that satisfies both \"ambient frame\" and \"deep links need it\" — <code style=\"background: rgba(0,0,0,0.18); padding: 1px 5px;\">/2026/…<\u002Fcode> everywhere, with the selector rewriting the segment rather than filtering the page. Cheap now, a migration later.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">3 · Career<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">The who-by-when grid has a Career column that no moment asks for. M2 is season-shaped; M6 is season-shaped. I'd <strong>delete the column<\u002Fstrong> until a coach asks for it — an axis with no job on it is where scope creep enters a roadmap.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: #0d0d0d; margin: 8px 0 0;\"><\u002Fdiv>\n\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 5 · The storyboard, drawn twice<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">The chip retires a rule in your glossary. Then: two routes to the field.<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 900px; text-wrap: pretty;\">Below, the same three moments — M1 to M2 to M4 — routed two ways. The frames are almost identical in both. <strong>The arrows are the design.<\u002Fstrong> Read the labels between the boxes, not the boxes.<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid #FF8000; background: #ffffff; max-width: 1250px;\">\n    <div style=\"background: #405C80; color: #ffffff; padding: 14px 20px; font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400;\">Finding: the time-trial exemption is wrong, and should be struck<\u002Fdiv>\n    <div style=\"padding: 20px; display: flex; flex-direction: column; gap: 16px;\">\n      <div style=\"font-size: 15px; line-height: 1.55;\"><code style=\"background: #e7e7e7; padding: 1px 5px;\">CONTEXT.md<\u002Fcode> says Percent Back is null for a DNF, a lapped rider, <em>and everyone in a time trial<\u002Fem>. The third clause doesn't survive what you just described: a real podium, positions 1 to N, and chip timing that starts every rider's clock at the mat. The Prologue has a category winner and a comparable time. <strong>Percent Back works there.<\u002Fstrong><\u002Fdiv>\n      <div style=\"display: flex; gap: 20px; flex-wrap: wrap;\">\n        <div style=\"flex: 1 1 340px; border-left: 2px solid #0d0d0d; padding-left: 14px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">The three states survive, narrower<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">Positioned · started-but-not-positioned · did not start. The middle state now covers only DNF and lapped — it loses a third of its population, but it does not go away, and neither does the reason it exists.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; border-left: 2px solid #FF8000; padding-left: 14px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">The upgrade<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">The Prologue is the <em>cleanest<\u002Fem> Percent Back of the season — no pack, no traffic, no tactics. It isn't a hole at x=1; it's the season's baseline, and the natural first point of every rider's arc.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; border-left: 2px solid #0d0d0d; padding-left: 14px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">The cost, and it's real<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">If Percent Back is comparable at every Round, the wall's cell can carry <em>magnitude<\u002Fem>. The moment it does, a finish-oriented rider's row becomes a row of how-far-back. The three-state mark was doing protective work — don't spend it just because the data now allows it.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"5a\" style=\"display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"display: flex; align-items: stretch; border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n      <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">5a<\u002Fdiv>\n      <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n        <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400;\">Route A — the Round is a lens <span style=\"font-weight: 400; color: #6e6e6e; font-size: 16px;\">(builds on <a href=\"#3b\">3b<\u002Fa>)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 13px; color: #6e6e6e;\">Four frames. Three arrows. The last one leaves the club tree.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-wrap: wrap; row-gap: 14px; align-items: stretch; max-width: 1250px;\">\n      <div style=\"flex: 1 1 200px; min-width: 0; border: 2px solid #0d0d0d; background: #ffffff; display: flex; flex-direction: column;\">\n        <div style=\"padding: 8px 11px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; font-weight: 700;\">M1 · Sunday night<\u002Fdiv>\n        <div style=\"padding: 12px 11px; display: flex; flex-direction: column; gap: 7px;\">\n          <div style=\"font-size: 15px; font-weight: 700;\">Wolf Pack · the wall<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">4 rows × 5 columns. A new column carries an R3 mark. One row has a dashed cell.<\u002Fdiv>\n          <div style=\"font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #405C80; font-weight: 700;\">Home<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 1 132px; min-width: 118px; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #6e6e6e; font-weight: 700;\">Step out · when<\u002Fdiv>\n        <div style=\"height: 2px; background: #0d0d0d; position: relative;\"><\u002Fdiv>\n        <div style=\"font-size: 12px; line-height: 1.35;\">open the column →<br><span style=\"color: #6e6e6e;\">who unchanged<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 200px; min-width: 0; border: 2px solid #0d0d0d; background: #ffffff; display: flex; flex-direction: column;\">\n        <div style=\"padding: 8px 11px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; font-weight: 700;\">M1 · the day<\u002Fdiv>\n        <div style=\"padding: 12px 11px; display: flex; flex-direction: column; gap: 7px;\">\n          <div style=\"font-size: 15px; font-weight: 700;\">Round 3 · Wolf Pack<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">4 rides. One DNF beside three finishers. One non-starter, carried in from the roster.<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #6e6e6e;\">/2026/round-3/squad/wolf-pack<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 1 132px; min-width: 118px; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #6e6e6e; font-weight: 700;\">Step sideways · who<\u002Fdiv>\n        <div style=\"height: 2px; background: #0d0d0d;\"><\u002Fdiv>\n        <div style=\"font-size: 12px; line-height: 1.35;\">pick a rider →<br><span style=\"color: #6e6e6e;\">when unchanged<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 200px; min-width: 0; border: 2px solid #0d0d0d; background: #ffffff; display: flex; flex-direction: column;\">\n        <div style=\"padding: 8px 11px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; font-weight: 700;\">M2 · the ride<\u002Fdiv>\n        <div style=\"padding: 12px 11px; display: flex; flex-direction: column; gap: 7px;\">\n          <div style=\"font-size: 15px; font-weight: 700;\">Rivera at Round 3<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">Her one ride, and a strip of her other four. Percent Back with the Prologue as point one.<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #6e6e6e;\">still inside the club tree<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 1 132px; min-width: 118px; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #405C80; font-weight: 700;\">The crossing<\u002Fdiv>\n        <div style=\"height: 4px; background: #FF8000;\"><\u002Fdiv>\n        <div style=\"font-size: 12px; line-height: 1.35; color: #405C80; font-weight: 600;\">\"who did she race?\" →<br>club tree ⇥ league tree, at Scoring Team<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 200px; min-width: 0; border: 2px solid #FF8000; background: rgba(255, 128, 0, 0.15); display: flex; flex-direction: column;\">\n        <div style=\"padding: 8px 11px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: #405C80; color: #ffffff; border-bottom: 2px solid #FF8000; font-weight: 700;\">M4 · the field<\u002Fdiv>\n        <div style=\"padding: 12px 11px; display: flex; flex-direction: column; gap: 7px;\">\n          <div style=\"font-size: 15px; font-weight: 700;\">Her category at Round 3<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.45;\">47 riders, Percent Back distribution, her mark in it. Squad-mates shown as ticks. Who's included stated on the face.<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #405C80; font-weight: 600;\">a leaf, not a level — nothing hangs below<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border: 2px solid #0d0d0d; padding: 14px 18px; max-width: 1250px; background: #ffffff; display: flex; gap: 24px; flex-wrap: wrap;\">\n      <div style=\"flex: 1 1 300px; font-size: 14px; line-height: 1.5;\"><strong>Back-path:<\u002Fstrong> three taps home, every one of them a real place. Each frame's parent is unambiguous, so a breadcrumb is honest rather than invented.<\u002Fdiv>\n      <div style=\"flex: 1 1 300px; font-size: 14px; line-height: 1.5;\"><strong>What it costs:<\u002Fstrong> four surfaces before M4 is reachable, and the crossing is buried three frames deep — the most important move in the app is also the least visited.<\u002Fdiv>\n      <div style=\"flex: 1 1 300px; font-size: 14px; line-height: 1.5;\"><strong>What would kill it:<\u002Fstrong> if the coach's real question is \"were <em>we<\u002Fem> good,\" not \"was <em>she<\u002Fem> good.\" Route A only ever crosses one rider at a time.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"5b\" style=\"display: flex; flex-direction: column; gap: 14px;\">\n    <div style=\"display: flex; align-items: stretch; border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n      <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">5b<\u002Fdiv>\n      <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n        <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400;\">Route B — the wall widens <span style=\"font-weight: 400; color: #6e6e6e; font-size: 16px;\">(builds on <a href=\"#3c\">3c<\u002Fa>)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 13px; color: #6e6e6e;\">One frame, four times. The arrows are all the same control — until the last one.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-wrap: wrap; row-gap: 14px; align-items: stretch; max-width: 1250px;\">\n      <div style=\"flex: 1 1 200px; min-width: 0; border: 2px solid #0d0d0d; background: #ffffff; display: flex; flex-direction: column;\">\n        <div style=\"padding: 8px 11px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; font-weight: 700;\">M1 · M3 · Sunday night<\u002Fdiv>\n        <div style=\"padding: 12px 11px; display: flex; flex-direction: column; gap: 7px;\">\n          <div style=\"font-size: 15px; font-weight: 700;\">The wall · Squad<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">4 rows × 5 columns. R3 fresh. Scope control sits above it, at position one of four.<\u002Fdiv>\n          <div style=\"font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #405C80; font-weight: 700;\">Home<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 1 132px; min-width: 118px; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #6e6e6e; font-weight: 700;\">Widen · who<\u002Fdiv>\n        <div style=\"height: 2px; background: #0d0d0d;\"><\u002Fdiv>\n        <div style=\"font-size: 12px; line-height: 1.35;\">scope: Club →<br><span style=\"color: #6e6e6e;\">same frame, more rows<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 200px; min-width: 0; border: 2px solid #0d0d0d; background: #ffffff; display: flex; flex-direction: column;\">\n        <div style=\"padding: 8px 11px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; font-weight: 700;\">M1 · club-wide<\u002Fdiv>\n        <div style=\"padding: 12px 11px; display: flex; flex-direction: column; gap: 7px;\">\n          <div style=\"font-size: 15px; font-weight: 700;\">The wall · Club<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">25 rows, grouped by Squad. Same columns, same three-state marks. The Head Coach's default.<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #6e6e6e;\">no new surface built<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 1 132px; min-width: 118px; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #405C80; font-weight: 700;\">The crossing<\u002Fdiv>\n        <div style=\"height: 4px; background: #FF8000;\"><\u002Fdiv>\n        <div style=\"font-size: 12px; line-height: 1.35; color: #405C80; font-weight: 600;\">scope: Scoring Team →<br>club tree ⇥ league tree, one notch of a control<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 200px; min-width: 0; border: 2px solid #FF8000; background: rgba(255, 128, 0, 0.15); display: flex; flex-direction: column;\">\n        <div style=\"padding: 8px 11px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: #405C80; color: #ffffff; border-bottom: 2px solid #FF8000; font-weight: 700;\">M4 · the peer string<\u002Fdiv>\n        <div style=\"padding: 12px 11px; display: flex; flex-direction: column; gap: 7px;\">\n          <div style=\"font-size: 15px; font-weight: 700;\">The wall · Scoring Team<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.45;\">Still rows. But now rows the Club doesn't own — riders on \"Salem Composite\" who aren't ours.<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #405C80; font-weight: 600;\">the join, made visible<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 1 132px; min-width: 118px; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;\">Widen again<\u002Fdiv>\n        <div style=\"height: 2px; background: #0d0d0d; border-top: 2px dashed #ffffff;\"><\u002Fdiv>\n        <div style=\"font-size: 12px; line-height: 1.35;\">scope: Conference →<br><strong>the frame breaks<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 200px; min-width: 0; border: 2px dashed #FF8000; background: #ffffff; display: flex; flex-direction: column;\">\n        <div style=\"padding: 8px 11px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 2px dashed #FF8000; font-weight: 700; color: #405C80;\">M4 · not a wall<\u002Fdiv>\n        <div style=\"padding: 12px 11px; display: flex; flex-direction: column; gap: 7px;\">\n          <div style=\"font-size: 15px; font-weight: 700;\">Conference · 180+<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.45;\">Rows stop working. A distribution with your riders marked in it. Same control, different animal.<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #405C80; font-weight: 600;\">the honest weak point of Route B<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border: 2px solid #0d0d0d; padding: 14px 18px; max-width: 1250px; background: #ffffff; display: flex; gap: 24px; flex-wrap: wrap;\">\n      <div style=\"flex: 1 1 300px; font-size: 14px; line-height: 1.5;\"><strong>Back-path:<\u002Fstrong> there isn't one, because you never left — you narrow the scope. That also means no breadcrumb, and no URL for \"where I was\" unless scope is in the URL.<\u002Fdiv>\n      <div style=\"flex: 1 1 300px; font-size: 14px; line-height: 1.5;\"><strong>What it buys:<\u002Fstrong> M1, M3 and M4 for the price of one surface, and the crossing is one notch from home rather than three frames deep. The persona cut becomes a default scope value.<\u002Fdiv>\n      <div style=\"flex: 1 1 300px; font-size: 14px; line-height: 1.5;\"><strong>What would kill it:<\u002Fstrong> the last notch. If Conference must be a distribution, the control promised sameness and broke it — and it broke it exactly at the crossing you most need to be legible.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid #0d0d0d; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px; max-width: 1250px; background: #ffffff;\">\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400;\">They are not exclusive, and that may be the answer<\u002Fdiv>\n    <div style=\"font-size: 15px; line-height: 1.55;\">Route A crosses <strong>one rider into her field<\u002Fstrong>. Route B crosses <strong>a group into a wider group<\u002Fstrong>. Those are different questions — \"was she good\" and \"were we good\" — and your M4 job stories contain both. A version C exists: build Route B's scope control for the club tree only (Squad ⇄ Club, no Conference notch), and hang Route A's crossing off the rider frame as the <em>only<\u002Fem> door into the league tree. Then the scope control never lies, and the crossing has exactly one representation. Cost: the Head Coach's \"how did the Club place against the conference\" has no home until later.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: #0d0d0d; margin: 8px 0 0;\"><\u002Fdiv>\n\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 4 · Five Rounds, and the first one may not fit<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">Then Rule 3 is defending nothing — and the Prologue is the real problem.<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 900px; text-wrap: pretty;\">You said a Round is a race, it's an Event. Taken literally that <strong>retires Rule 3<\u002Fstrong>: if Oregon's conferences don't split a Round across two Events, the rule is guarding a case that doesn't occur, and a Round can be a place with an Event behind it. I'd rather retire it than quietly design around it. But what Rule 3 was actually protecting is still on the board, and it's sitting in position one.<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1160px;\">\n    <div style=\"padding: 12px 18px; border-bottom: 2px solid #0d0d0d; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;\">The season, as you described it<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(5, 1fr);\">\n      <div style=\"border-right: 2px solid #0d0d0d; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; background: rgba(255, 128, 0, 0.15);\">\n        <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 20px; font-weight: 400;\">Prologue<\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.45;\">Percent Back — <strong style=\"color: #405C80;\">?<\u002Fstrong><br>Season Points — <strong style=\"color: #405C80;\">?<\u002Fstrong><br>Counts as a Start — <strong style=\"color: #405C80;\">?<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-right: 2px solid #0d0d0d; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 20px; font-weight: 400;\">Race 2<\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">Percent Back ✓<br>Season Points ✓<br>Start ✓<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-right: 2px solid #0d0d0d; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 20px; font-weight: 400;\">Race 3<\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">Percent Back ✓<br>Season Points ✓<br>Start ✓<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-right: 2px solid #0d0d0d; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 20px; font-weight: 400;\">Race 4<\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">Percent Back ✓<br>Season Points ✓<br>Start ✓<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; background: #faf9f4;\">\n        <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 20px; font-weight: 400;\">State Champs<\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.45; color: #0d0d0d;\">Percent Back ✓<br>Own scoring<br>Gated on Starts<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding: 14px 18px; border-top: 2px solid #0d0d0d; font-size: 14px; line-height: 1.5;\">Five columns is a good wall. But if the Prologue is a time trial, <strong>Percent Back is null for everyone in it<\u002Fstrong> — so the wall's first column is uniformly \"started, no comparable position,\" and the season opens with a column that shows nothing about form. Three readings, and they are not cosmetic.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch;\">\n\n    <div id=\"4a\" style=\"width: 500px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">4a<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 21px; font-weight: 400; letter-spacing: -0.01em;\">Round 1 like any other<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">If the Prologue is mass-start<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">It has a category winner, so Percent Back works, and it feeds the standings. Nothing special about it at all.<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Everything. Five uniform columns, one code path, and the season arc is a five-point line with no explaining to do.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Nothing — which is why it's worth being sure. If it's wrong, every season chart in the app has a bad first point and nobody notices for a year.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Does the Prologue actually publish a place in a category — or a seed time?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"4b\" style=\"width: 500px; display: flex; flex-direction: column; border: 2px solid #FF8000; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #FF8000;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">4b<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 21px; font-weight: 400; letter-spacing: -0.01em;\">A Round with no positions<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">If it's a time trial<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #FF8000;\">It stays on the time axis and counts as a Start, but every mark in the column is \"started, no comparable position.\" The season's <strong>opening column is a participation column<\u002Fstrong>, for the whole club, by construction.<\u002Fdiv>\n      <div style=\"padding: 16px; background: #faf9f4; border-bottom: 2px solid #FF8000; display: flex; gap: 10px; align-items: center; font-size: 13px;\">\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 8px 10px; flex: 1;\">P<br><span style=\"color: #6e6e6e;\">◤ ◤ ◤ ◤<\u002Fspan><\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 8px 10px; flex: 1;\">R2<br><span style=\"color: #6e6e6e;\">■ ◤ ■ □<\u002Fspan><\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 8px 10px; flex: 1;\">R3<br><span style=\"color: #6e6e6e;\">■ ■ ■ ◤<\u002Fspan><\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 8px 10px; flex: 1;\">R4<br><span style=\"color: #6e6e6e;\">■ ■ □ ■<\u002Fspan><\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 8px 10px; flex: 1;\">SC<br><span style=\"color: #6e6e6e;\">■ · ■ ·<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">It makes the two-orientations principle <em>structural instead of aspirational<\u002Fem>. Every coach's first encounter with the season is a column where starting is the only fact — so a view that renders only place visibly fails on day one, when you can still fix it.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">The season arc has a hole at x=1 forever, and you'll be explaining it to twenty coaches every September. The Prologue's own Round page needs a different body than the other four.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Nothing kills it if it's true. This is a fact to confirm, not a design to choose.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"4c\" style=\"width: 500px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #0d0d0d; color: #ffffff; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">4c<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 21px; font-weight: 400; letter-spacing: -0.01em;\">Not on the time axis<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">If it only seeds<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">The Prologue is context for the season, not a point in it — a baseline strip above the wall rather than a column inside it. Four columns plus State Champs.<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Clean arcs and one column shape. And it gives M6 something concrete: \"last season as a baseline\" and \"the Prologue as a baseline\" become the same component, built once.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">You've dropped a Start from the wall. If the league counts the Prologue toward State Champs eligibility, the app is now under-counting the exact fact ADR-0001 made first-class — the worst failure available.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Does starting the Prologue count as a Start to the league? If yes, this option is off the table.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid #0d0d0d; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px; max-width: 1160px; background: #ffffff;\">\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400;\">On the vocabulary, since you used all three words<\u002Fdiv>\n    <div style=\"font-size: 15px; line-height: 1.55;\">\"A Round is a race, it's an Event\" collapses a distinction your own glossary spent effort building. I think that's fine — and better than fine, it's a simplification worth taking: <strong>Round is the coach-facing name, Event is the ingest-facing one<\u002Fstrong>, and they're 1:1 until Oregon splits a Round across two Events. Then Rule 3 becomes a data note rather than a navigation rule, and a Round page is honestly just <code style=\"background: #e7e7e7; padding: 1px 5px;\">/2026/prologue<\u002Fcode> resolving to one Event. The thing I would <em>not<\u002Fem> collapse is Scoring Team vs. Club — that one is doing real work and the crossing depends on it.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: #0d0d0d; margin: 8px 0 0;\"><\u002Fdiv>\n\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 3 · Taken: the squad-scoped Roster Wall is home<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">So what is a Round?<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 880px; text-wrap: pretty;\">Landing on <a href=\"#1b\">1b<\u002Fa> scoped to a Squad settles the persona question in one direction — the Squad Leader's surface is the front door, and the other two are variations on it. It also inherits <a href=\"#1b\">1b<\u002Fa>'s two debts, and both are load-bearing: <strong>M1 has no object<\u002Fstrong> and <strong>M0 has nowhere to live<\u002Fstrong>. Every version below is the same home page. They differ only in what a Round is allowed to be — which is the open question you listed, and it turns out to be the one that pays both debts or neither.<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch;\">\n\n    <div id=\"3a\" style=\"width: 560px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">3a<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em;\">A Round is only a column<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">One surface, no destinations<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">Sunday night, a column appears. That is the whole of M1. A Round is never a page and never a URL — the wall <em>is<\u002Fem> the answer, and a rider is the only place you can go.<\u002Fdiv>\n      <div style=\"padding: 18px 16px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff;\">\n          <div style=\"display: grid; grid-template-columns: 1fr 34px 34px 44px 34px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 2px solid #0d0d0d; background: #e7e7e7;\">\n            <span style=\"padding: 6px 10px;\">Wolf Pack<\u002Fspan><span style=\"padding: 6px 0; text-align: center;\">R1<\u002Fspan><span style=\"padding: 6px 0; text-align: center;\">R2<\u002Fspan><span style=\"padding: 6px 0; text-align: center; background: #FF8000; color: #0d0d0d; font-weight: 700;\">R3<\u002Fspan><span style=\"padding: 6px 0; text-align: center; opacity: 0.4;\">R4<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 34px 34px 44px 34px; font-size: 13px; border-bottom: 1px solid #e7e7e7; align-items: center;\">\n            <span style=\"padding: 7px 10px;\">A. Rivera<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center; background: rgba(255, 128, 0, 0.15); padding: 7px 0; font-weight: 700;\">■<\u002Fspan><span style=\"text-align: center; opacity: 0.3;\">·<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 34px 34px 44px 34px; font-size: 13px; border-bottom: 1px solid #e7e7e7; align-items: center;\">\n            <span style=\"padding: 7px 10px;\">J. Okafor<\u002Fspan><span style=\"text-align: center;\">◤<\u002Fspan><span style=\"text-align: center;\">□<\u002Fspan><span style=\"text-align: center; background: rgba(255, 128, 0, 0.15); padding: 7px 0; font-weight: 700;\">■<\u002Fspan><span style=\"text-align: center; opacity: 0.3;\">·<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 34px 34px 44px 34px; font-size: 13px; align-items: center;\">\n            <span style=\"padding: 7px 10px;\">M. Chen<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center; background: rgba(255, 128, 0, 0.15); padding: 7px 0; font-weight: 700;\">◤<\u002Fspan><span style=\"text-align: center; opacity: 0.3;\">·<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; padding-left: 4px;\"><div style=\"width: 2px; height: 20px; background: #0d0d0d;\"><\u002Fdiv><div style=\"font-size: 12px; color: #6e6e6e;\">the only exit<\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 10px 12px; font-size: 14px;\">A Rider<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">One surface to build and one to learn — the smallest thing that could be shipped by the next ingest. Rule 3 becomes trivially true: if a Round is never a route, an Event id can never leak into a URL. There is no back-path problem because there is no forward path.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">The Head Coach. \"How did the Club do at Round 3\" is not a squad wall, and M4's crossing has nowhere to hang except inside a single cell. M0 is still homeless.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Can four marks in a column answer \"what happened?\" — or does the coach want the Round the instant she sees them?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"3b\" style=\"width: 560px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">3b<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em;\">A Round is a lens on the wall<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">One home, two readings<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">A Round is a place, but always <strong>squad-scoped<\u002Fstrong> — your four riders' rides at Round 3, never the whole club. Opening a column opens the Round; the way back is the wall, by construction.<\u002Fdiv>\n      <div style=\"padding: 18px 16px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 9px 11px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;\"><span>Wolf Pack · the wall<\u002Fspan><span style=\"font-size: 11px; padding: 2px 6px; background: #FF8000; color: #0d0d0d; font-weight: 700; letter-spacing: 0.06em;\">R3 NEW<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; padding-left: 4px;\"><div style=\"width: 2px; height: 20px; background: #FF8000;\"><\u002Fdiv><div style=\"font-size: 12px; color: #405C80; font-weight: 600;\">open the column<\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 2px solid #FF8000; background: #ffffff;\">\n          <div style=\"padding: 8px 11px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255, 128, 0, 0.15); border-bottom: 2px solid #FF8000; font-weight: 600;\">Round 3 · Wolf Pack<\u002Fdiv>\n          <div style=\"padding: 8px 11px; font-size: 13px; border-bottom: 1px solid #e7e7e7;\">4 rides, three states, place never dominating<\u002Fdiv>\n          <div style=\"padding: 8px 11px; font-size: 13px; border-bottom: 1px solid #e7e7e7;\">1 rider did not start — carried in from the roster<\u002Fdiv>\n          <div style=\"padding: 8px 11px; font-size: 13px; font-weight: 600; color: #405C80;\">▸ the field each of them raced in<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; color: #6e6e6e; padding-left: 2px;\">/2026/round-3/squad/wolf-pack &nbsp;·&nbsp; back = the wall<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">M1 and M3 in one vocabulary, and the crossing finally has a home — it hangs off the Round page, where the field is a real set: \"your four inside a field of 180.\" Deep links carry Season and Round without an Event id. The back-path is structural, not a button.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Two shapes for the same rows, both maintained, both needing their own answer to the three states. And the Head Coach still has no club-wide Round — you either give him five squad walls or a sixth surface.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Is a squad-scoped Round enough for the person who does the ingest and wants all 25 at once?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"3c\" style=\"width: 560px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">3c<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em;\">The wall has a scope<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">The crossing is a widening<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">One wall, three scopes. Squad is where you land; Club and Scoring Team are the same wall widened. <strong>The crossing is not a link — it is a step up the scope control.<\u002Fstrong> A Round is a place too, at whatever scope you're standing in.<\u002Fdiv>\n      <div style=\"padding: 18px 16px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"display: flex; border: 2px solid #0d0d0d; background: #ffffff; font-size: 12px;\">\n          <div style=\"flex: 1; padding: 8px 10px; background: #FF8000; color: #0d0d0d; font-weight: 700;\">Squad · 4<\u002Fdiv>\n          <div style=\"flex: 1; padding: 8px 10px; border-left: 2px solid #0d0d0d;\">Club · 25<\u002Fdiv>\n          <div style=\"flex: 1; padding: 8px 10px; border-left: 2px solid #0d0d0d; background: #e7e7e7;\">Scoring Team<\u002Fdiv>\n          <div style=\"flex: 1.2; padding: 8px 10px; border-left: 2px solid #0d0d0d; background: #e7e7e7;\">Conference · 180<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #6e6e6e; padding-left: 2px;\">← club tree &nbsp;│&nbsp; league tree →<\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 10px 12px; font-size: 13px;\">Rows of riders, R1…SC as columns<\u002Fdiv>\n        <div style=\"border: 2px dashed #FF8000; background: rgba(255, 128, 0, 0.15); padding: 10px 12px; font-size: 13px; color: #405C80;\"><strong>At Conference the wall stops being rows.<\u002Fstrong> 180 riders is a distribution with your four marked in it. Same control, different shape.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">The crossing gets one representation that works from every view, and the tree boundary is <em>visible<\u002Fem> as the place the control changes character. Personas collapse to a default scope: Assistant lands Squad, Head lands Club, same wall. M4 becomes \"widen,\" not \"go somewhere else.\"<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Most to build before anything is usable, and the widest step breaks the metaphor — a scope control whose last position changes the view's shape is the one thing a scope control shouldn't do.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Does the wall survive the crossing? If Conference has to become a histogram, the control was a lie and you've hidden the most important move in the app inside a segmented button.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid #0d0d0d; background: #405C80; color: #ffffff; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px; max-width: 1160px;\">\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 26px; font-weight: 400; letter-spacing: -0.01em;\">What 1b-scoped-to-squad already decided, whether you meant it or not<\u002Fdiv>\n    <div style=\"font-size: 15px; line-height: 1.55;\">The Squad Leader is the <strong>primary<\u002Fstrong> user, not the middle one. The Head Coach becomes a Squad Leader with a wider default scope and a queue; the Assistant becomes one with no write. That is the \"three depths, not three roles\" answer — arrived at by picking a home page rather than by deciding it. Worth saying out loud before we storyboard, because it means <strong>M0 fans out<\u002Fstrong>: the unmapped plate belongs to whoever's Scoring Team it landed on, and the Head Coach's version is just the unfiltered one.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: #0d0d0d; margin: 8px 0 0;\"><\u002Fdiv>\n\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 2 · Five more spines, going wider<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">You said none of those. Here are five that aren't a tree at all.<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 860px; text-wrap: pretty;\">Round-feed, roster-wall and work-desk were all the same assumption wearing three hats: that there is a hierarchy and a coach walks down it. These five drop that. Two of them argue the product is a different product.<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch;\">\n\n    <div id=\"2a\" style=\"width: 500px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">2a<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em;\">The Season Ledger<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">Season is the object, not the frame<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">One long document per Season. You land in the middle of it. You never leave a Season — you change magnification.<\u002Fdiv>\n      <div style=\"padding: 18px 16px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"border: 2px solid #FF8000; background: #ffffff;\">\n          <div style=\"padding: 7px 11px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(255, 128, 0, 0.15); border-bottom: 2px solid #FF8000; font-weight: 600;\">Season 2026 · the whole thing<\u002Fdiv>\n          <div style=\"padding: 9px 11px; font-size: 13px; border-bottom: 1px solid #e7e7e7;\">Rounds strip · R1 R2 <strong>R3<\u002Fstrong> R4 SC<\u002Fdiv>\n          <div style=\"padding: 9px 11px; font-size: 13px; border-bottom: 1px solid #e7e7e7;\">Published standings, verbatim<\u002Fdiv>\n          <div style=\"padding: 9px 11px; font-size: 13px; border-bottom: 1px solid #e7e7e7;\">Roster · 25, by Squad<\u002Fdiv>\n          <div style=\"padding: 9px 11px; font-size: 13px;\">The club's arc<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; color: #6e6e6e; padding-left: 2px;\">zoom in ▾ &nbsp;a Round · a Squad · a Rider — all sections of this page<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-botto
