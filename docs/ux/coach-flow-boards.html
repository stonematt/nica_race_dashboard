document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  font-weight: 700;\n  font-display: swap;\n  src: url(\"feaf77f7-c383-489b-87c2-3d2cd2a15e83\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8a8c4c52-df4d-41be-a1db-db97d974e011\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #faf9f4; }\n  a { color: #405C80; text-decoration: none; border-bottom: 1px solid #405C80; }\n  a:hover { color: #0072FF; border-bottom-color: #0072FF; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: 'Nunito', system-ui, sans-serif; color: #0d0d0d; background: #faf9f4; padding: 56px; display: flex; flex-direction: column; gap: 72px;\">\n\n\n\n<div style=\"border: 2px solid #0d0d0d; background: #405C80; color: #ffffff; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; max-width: 1250px;\">\n  <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: 0.01em; color: #ffffff;\">THEME PROVENANCE — READ BEFORE EDITING<\u002Fdiv>\n  <div style=\"font-size: 15px; line-height: 1.55;\">This document is drawn in the app's own brand, taken from <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">src/app/globals.css<\u002Fcode> and <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">docs/brand.md<\u002Fcode> — not from any other design system. Tokens used verbatim: paper <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">#faf9f4<\u002Fcode>, surface <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">#ffffff<\u002Fcode>, ink <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">#0d0d0d<\u002Fcode>, muted <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">#6e6e6e<\u002Fcode>, border <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">#e7e7e7<\u002Fcode>, accent orange <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">#FF8000<\u002Fcode>, navy <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">#405C80<\u002Fcode>, blue <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">#0072FF<\u002Fcode>. Anton for display, Nunito for body. <strong>Every rider name in these boards is fictional<\u002Fstrong> — no name here came from a result payload, and the Scoring Team names are public organisations.<\u002Fdiv>\n  <div style=\"font-size: 15px; line-height: 1.55; border-top: 2px solid #FF8000; padding-top: 10px;\"><strong>The brand rules are honoured here, so don't \"fix\" them:<\u002Fstrong> ink on orange and never white; orange leads as a highlight, never as a field; navy is the ground with orange taking the rule and the marks that matter. Orange fails contrast as small text on paper, which is why emphasis text is navy and orange appears only on chips, rules, highlighted rows and headline numbers. Fonts load from a CDN <em>in this artifact only<\u002Fem> — the app self-hosts them via <code style=\"background: rgba(0,0,0,0.25); padding: 1px 5px;\">next/font<\u002Fcode> on purpose, and that decision stands.<\u002Fdiv>\n<\u002Fdiv>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 10 · The crossing, literally<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">One tap. Four rows we own become thirty we don't.<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 900px; text-wrap: pretty;\">That's the crossing. Here it is as two screens and the tap between them — and then the sequencing question restated as \"what can a coach say out loud on the day you ship.\"<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid #FF8000; background: #405C80; color: #ffffff; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; max-width: 1250px;\">\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400;\">First: a Club cannot span Conferences in a Season. That's an invariant, not a trait.<\u002Fdiv>\n    <div style=\"font-size: 15px; line-height: 1.55;\">Stronger than what I proposed in <a href=\"#9e\" style=\"color: #ffffff; border-bottom-color: rgba(255,255,255,0.6);\">9e<\u002Fa> — drop the \"a Club <em>may<\u002Fem> span conferences\" hedge. The right entry is: <strong>a Club belongs to exactly one Conference per Season<\u002Fstrong> (it can span several Scoring Teams, all inside that Conference). So through Round 4 the far side of the crossing is <em>always<\u002Fem> your own Conference, with no branch and no ambiguity. At State Champs the Category merges league-wide and the far side doubles — that transition is the only variability in the whole mechanism.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"10a\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">10a<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">The tap<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-wrap: wrap; align-items: stretch;\">\n\n      <div style=\"flex: 1 1 320px; min-width: 0; padding: 20px; border-right: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #6e6e6e;\">Where she is · the club tree<\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d;\">\n          <div style=\"padding: 8px 11px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; font-weight: 700;\">Squad · Wolf Pack<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 30px 30px 40px 30px 30px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6e6e6e; border-bottom: 1px solid #e7e7e7;\">\n            <span style=\"padding: 6px 10px;\">Rider<\u002Fspan><span style=\"padding: 6px 0; text-align: center;\">P<\u002Fspan><span style=\"padding: 6px 0; text-align: center;\">R2<\u002Fspan><span style=\"padding: 6px 0; text-align: center; color: #405C80; font-weight: 700;\">R3<\u002Fspan><span style=\"padding: 6px 0; text-align: center;\">R4<\u002Fspan><span style=\"padding: 6px 0; text-align: center;\">SC<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 30px 30px 40px 30px 30px; font-size: 13px; align-items: center; border-bottom: 1px solid #e7e7e7;\">\n            <span style=\"padding: 8px 10px; font-weight: 700;\">A. Rivera<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center; background: #FF8000; color: #0d0d0d; padding: 8px 0; font-weight: 700;\">■<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center; color: #6e6e6e;\">□<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 30px 30px 40px 30px 30px; font-size: 13px; align-items: center; border-bottom: 1px solid #e7e7e7;\">\n            <span style=\"padding: 8px 10px;\">O. Marek<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center;\">◤<\u002Fspan><span style=\"text-align: center; padding: 8px 0;\">■<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center; color: #6e6e6e;\">□<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 30px 30px 40px 30px 30px; font-size: 13px; align-items: center; border-bottom: 1px solid #e7e7e7;\">\n            <span style=\"padding: 8px 10px;\">C. Vance<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center; padding: 8px 0;\">■<\u002Fspan><span style=\"text-align: center;\">◤<\u002Fspan><span style=\"text-align: center; color: #6e6e6e;\">□<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 30px 30px 40px 30px 30px; font-size: 13px; align-items: center;\">\n            <span style=\"padding: 8px 10px;\">P. Ibarra<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center; color: #6e6e6e;\">□<\u002Fspan><span style=\"text-align: center; padding: 8px 0;\">■<\u002Fspan><span style=\"text-align: center;\">■<\u002Fspan><span style=\"text-align: center; color: #6e6e6e;\">□<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.5;\"><strong>4 riders. 5 Rounds. 20 cells.<\u002Fstrong> Every row is someone we coach. The red cell is Rivera at Race 3.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 1 150px; min-width: 130px; padding: 20px 12px; border-right: 2px solid #0d0d0d; display: flex; flex-direction: column; justify-content: center; gap: 10px; background: rgba(255, 128, 0, 0.15);\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Tap the cell<\u002Fdiv>\n        <div style=\"height: 4px; background: #FF8000;\"><\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.4; color: #405C80; font-weight: 600;\">\"who did she actually race?\"<\u002Fdiv>\n        <div style=\"font-size: 12px; line-height: 1.4;\">The <strong>Round doesn't change.<\u002Fstrong> Only the set of people does.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 380px; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Where she raced · the league tree<\u002Fdiv>\n        <div style=\"border: 2px solid #FF8000;\">\n          <div style=\"padding: 8px 11px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; background: #FF8000; color: #0d0d0d; font-weight: 700;\">HS2 Girls — North · Race 3<\u002Fdiv>\n          <div style=\"padding: 7px 11px; font-size: 11px; background: rgba(255, 128, 0, 0.15); border-bottom: 2px solid #FF8000; color: #405C80; font-weight: 600;\">30 started · 28 positioned · 3 of ours<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6e6e6e; border-bottom: 1px solid #e7e7e7;\">\n            <span style=\"padding: 6px 8px;\">Plc<\u002Fspan><span style=\"padding: 6px 4px;\">Rider<\u002Fspan><span style=\"padding: 6px 4px;\">Scoring Team<\u002Fspan><span style=\"padding: 6px 8px; text-align: right;\">% Back<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 13px; border-bottom: 1px solid #e7e7e7;\">\n            <span style=\"padding: 7px 8px;\">1<\u002Fspan><span style=\"padding: 7px 4px; color: #6e6e6e;\">—<\u002Fspan><span style=\"padding: 7px 4px; color: #6e6e6e;\">Portland Metro Composite<\u002Fspan><span style=\"padding: 7px 8px; text-align: right;\">0.0<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 13px; border-bottom: 1px solid #e7e7e7;\">\n            <span style=\"padding: 7px 8px;\">2<\u002Fspan><span style=\"padding: 7px 4px; color: #6e6e6e;\">—<\u002Fspan><span style=\"padding: 7px 4px; color: #6e6e6e;\">West Linn High School<\u002Fspan><span style=\"padding: 7px 8px; text-align: right;\">4.1<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 13px; border-bottom: 1px solid #e7e7e7; background: #FF8000; color: #0d0d0d; font-weight: 700;\">\n            <span style=\"padding: 7px 8px;\">3<\u002Fspan><span style=\"padding: 7px 4px;\">A. Rivera<\u002Fspan><span style=\"padding: 7px 4px;\">Salem Composite<\u002Fspan><span style=\"padding: 7px 8px; text-align: right;\">7.8<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 13px; border-bottom: 1px solid #e7e7e7;\">\n            <span style=\"padding: 7px 8px;\">4<\u002Fspan><span style=\"padding: 7px 4px; color: #6e6e6e;\">—<\u002Fspan><span style=\"padding: 7px 4px; color: #6e6e6e;\">Lake Oswego Composite<\u002Fspan><span style=\"padding: 7px 8px; text-align: right;\">9.2<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 13px; border-bottom: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15); font-weight: 600;\">\n            <span style=\"padding: 7px 8px;\">5<\u002Fspan><span style=\"padding: 7px 4px;\">P. Ibarra<\u002Fspan><span style=\"padding: 7px 4px;\">South Salem HS Descenders<\u002Fspan><span style=\"padding: 7px 8px; text-align: right;\">11.4<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 13px; border-bottom: 1px solid #e7e7e7; color: #6e6e6e;\">\n            <span style=\"padding: 7px 8px;\">⋮<\u002Fspan><span style=\"padding: 7px 4px;\">21 more<\u002Fspan><span style=\"padding: 7px 4px;\"><\u002Fspan><span style=\"padding: 7px 8px; text-align: right;\">⋮<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 13px; border-bottom: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15); font-weight: 600;\">\n            <span style=\"padding: 7px 8px;\">27<\u002Fspan><span style=\"padding: 7px 4px;\">O. Marek<\u002Fspan><span style=\"padding: 7px 4px;\">Sprague HS Descenders<\u002Fspan><span style=\"padding: 7px 8px; text-align: right;\">58.6<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 34px 1fr 1fr 58px; font-size: 13px;\">\n            <span style=\"padding: 7px 8px;\">◤<\u002Fspan><span style=\"padding: 7px 4px; color: #6e6e6e;\">—<\u002Fspan><span style=\"padding: 7px 4px; color: #6e6e6e;\">Tualatin High School<\u002Fspan><span style=\"padding: 7px 8px; text-align: right; color: #6e6e6e;\">DNF<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.5;\"><strong>30 riders. 1 Round. 27 rows we don't own.<\u002Fstrong> Same day, same course, same Category. Her two squad-mates in it are tinted — that's how a coach sees the squad <em>inside<\u002Fem> the field rather than instead of it.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border-top: 2px solid #0d0d0d; display: grid; grid-template-columns: repeat(3, 1fr);\">\n      <div style=\"padding: 16px 20px; border-right: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 5px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">What crossed<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\">The <strong>who<\u002Fstrong>. From a set the coaches own and edit, to a set the league publishes and we may never touch.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px 20px; border-right: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 5px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">What didn't<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\">The <strong>when<\u002Fstrong>. Race 3 on both sides. One axis moved — that's Rule 2 holding.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px 20px; display: flex; flex-direction: column; gap: 5px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Why it's the whole product<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\">\"3rd\" means nothing until you know it's 3rd of 30. The wall can never say that. <strong>Only this screen can.<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"10b\" style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 22px 26px; display: flex; flex-direction: column; gap: 12px; max-width: 1250px;\">\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">A third correction, and this one changes the drawing above<\u002Fdiv>\n    <div style=\"font-size: 15px; line-height: 1.55;\">I've been calling the far side a <em>distribution<\u002Fem> since <a href=\"#3c\">3c<\u002Fa>. The corpus says don't. Category sizes at the 2025 Prologue run from <strong>2 riders to about 80<\u002Fstrong> — Varsity Girls South had two; HS1 Boys North had eighty. A histogram is meaningless at N=2 and a ranked list is unreadable at N=80 without truncation.<\u002Fdiv>\n    <div style=\"font-size: 15px; line-height: 1.55;\">So the Category view is a <strong>ranked list, anchored on her row<\u002Fstrong> — a few above, a few below, squad-mates pinned wherever they landed, and the field size stated in words. It reads identically at 2 and at 80. That's what's drawn in <a href=\"#10a\">10a<\u002Fa>, and it's a smaller build than a chart.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"10c\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">10c<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">The sequencing question, as sentences a coach can say on ship day<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr;\">\n      <div style=\"padding: 20px; border-right: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">If the crossing ships early<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.5;\">Wall → Category. Two screens, one tap.<\u002Fdiv>\n        <div style=\"border-left: 4px solid #FF8000; padding-left: 14px; font-size: 16px; line-height: 1.5; font-style: italic;\">\"You were third of thirty in HS2 Girls North, seven point eight percent back. Two of your squad were in there with you.\"<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\"><strong>Can't yet say:<\u002Fstrong> whether she's improving. No season arc. And if the queue isn't built, \"thirty\" might really be thirty-two.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">If it ships in its current slot<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.5;\">Wall → Club scope → queue → rider frame. Four surfaces, Category last.<\u002Fdiv>\n        <div style=\"border-left: 4px solid #0d0d0d; padding-left: 14px; font-size: 16px; line-height: 1.5; font-style: italic;\">\"You started four of four. You were eleven percent back at the Prologue and eight at Race 3 — you're moving. And every rider in the club is accounted for.\"<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\"><strong>Can't yet say:<\u002Fstrong> what eight percent back was <em>against<\u002Fem>. The thing the athletes actually asked for is the last thing they get.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top: 2px solid #0d0d0d; padding: 16px 20px; font-size: 15px; line-height: 1.55; background: #faf9f4;\"><strong>That's the trade, and it's genuinely a trade.<\u002Fstrong> One ships the most-wanted sentence on top of a roster you know is short a few riders. The other ships an honest, complete, self-referential product that can't answer the question that started the project. Your call — and \"split it\" is legitimate: the cell→Category tap early, the full rider frame later.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"10d\" style=\"border: 2px dashed #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px dashed #0d0d0d; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">10d<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Parked for a later session — the Category table's columns<\u002Fspan>\n      <span style=\"font-size: 13px; color: #6e6e6e;\">not designed here, just held<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr;\">\n      <div style=\"padding: 18px 20px; border-right: 1px solid #e7e7e7; border-bottom: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Points and Time — verified available<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\">The Prologue's published list already carries a <strong>Points<\u002Fstrong> field and a <strong>Time<\u002Fstrong> field. So both are readable verbatim and stay on the description side of ADR-0001 — nothing is being recomputed. Safe to add whenever you want them.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; border-bottom: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Splits — unverified, check before promising<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\">The lists in the corpus carry start and end <em>time of day<\u002Fem>, not lap splits. Splits may simply not be published. Worth confirming against a live list before a design session assumes them — it's the difference between a column and a feature request to the league.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; border-right: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">The elision is a design object, not a truncation<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\">\"⋮ 21 more\" is the <em>only<\u002Fem> place the number thirty is actually felt. Don't treat it as something to fix — it's carrying the payload of the whole screen. Later question: does it expand in place, or stay a permanent statement of scale?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">The tension to bring to that session<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.5;\">Every column added pulls against <a href=\"#7a\">7a<\u002Fa>: the frame has to survive being said aloud. <strong>A wider table is a bigger picture and a worse sentence.<\u002Fstrong> Likely shape — the anchored row stays speakable, the extra columns are a disclosure you open. But that's a call for then, not now.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: #0d0d0d; margin: 8px 0 0;\"><\u002Fdiv>\n\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 9 · Reconciled<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">Your model is right, the docs are missing a word, and I was wrong again — differently.<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 900px; text-wrap: pretty;\">The Prologue <em>is<\u002Fem> conference-scored — the corpus is unambiguous. That plus \"we're always North\" fixes my turn-8 overcorrection, exposes a gap in <code style=\"background: #e7e7e7; padding: 1px 5px;\">CONTEXT.md<\u002Fcode>, and kills one view you'd otherwise have built.<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"9a\" style=\"border: 2px solid #FF8000; background: #ffffff; max-width: 1250px;\">\n    <div style=\"background: #405C80; color: #ffffff; padding: 16px 20px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px;\">9a<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Yes — the Prologue is scored by Conference<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding: 20px; display: flex; flex-direction: column; gap: 16px;\">\n      <div style=\"font-size: 15px; line-height: 1.55;\">Race 1 runs <strong>28 contests<\u002Fstrong>, and their published names carry the conference in the string: <em>Varsity Girls&nbsp;–&nbsp;North<\u002Fem>, <em>HS2 Girls&nbsp;–&nbsp;North<\u002Fem>, <em>MS3 Boys&nbsp;–&nbsp;South<\u002Fem>, and so on. Fourteen categories × two conferences. The whole league rides the same day and is still ranked inside its own conference.<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55;\">Race 5 — State Champs — runs <strong>14 contests<\u002Fstrong>. The conference suffix is gone: the categories merge. <strong>That is your sentence, in the data:<\u002Fstrong> <em>\"we're scored against the North until we get to state.\"<\u002Fem><\u002Fdiv>\n      <div style=\"display: flex; gap: 20px; flex-wrap: wrap; border-top: 2px solid #0d0d0d; padding-top: 16px;\">\n        <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Rounds 1–4<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">28 contests. Category is <strong>conference-scoped<\u002Fstrong>. A rider's peer set is her category within North.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Round 5<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">14 contests. Category is <strong>league-wide<\u002Fstrong>. The peer set doubles overnight, on the one Round that matters most.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">2026 so far<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">One Event ingested — Race 1, Old Oak Prologue — and it carries 28 groups. Same shape holds.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"9b\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">9b<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">The missing word is Category — and it's the most important one<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding: 20px; display: flex; flex-direction: column; gap: 16px;\">\n      <div style=\"font-size: 15px; line-height: 1.55;\"><code style=\"background: #e7e7e7; padding: 1px 5px;\">CONTEXT.md<\u002Fcode> defines Conference, Division, Club, Squad, Scoring Team, Level, Round, Event — and <strong>never names the set a rider is actually ranked in.<\u002Fstrong> But the league does: the results field is literally <code style=\"background: #e7e7e7; padding: 1px 5px;\">CategoryRank<\u002Fcode>, and the grouping is <code style=\"background: #e7e7e7; padding: 1px 5px;\">CONTEST.NAME<\u002Fcode>. Category is the denominator of Percent Back and the thing the riders themselves asked about. It has been doing load-bearing work anonymously all session.<\u002Fdiv>\n      <div style=\"border: 2px solid #FF8000; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; background: rgba(255, 128, 0, 0.15);\">\n        <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Proposed glossary entry<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\"><strong>Category<\u002Fstrong> — the league's raced-and-ranked group: Level plus grade band plus gender, and <em>through Round 4, Conference<\u002Fem> (\"HS2 Girls – North\"). Published as a contest per Event. The peer set a Rider is ranked in, and the denominator of Percent Back. <strong>Conference-scoped at Rounds 1–4; league-wide at State Champs.<\u002Fstrong> <em>Avoid:<\u002Fem> class, group, division.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 20px; flex-wrap: wrap;\">\n        <div style=\"flex: 1 1 380px; border-left: 2px solid #0d0d0d; padding-left: 14px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">This re-labels the crossing<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">It was never \"Club → Conference.\" It is <strong>Rider → Category<\u002Fstrong>, and the Category <em>carries<\u002Fem> the conference inside its name. That is a much smaller, more concrete thing to build than a tree traversal, and it's the thing the athletes asked for.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 380px; border-left: 2px solid #0d0d0d; padding-left: 14px; display: flex; flex-direction: column; gap: 5px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">And it keeps Division honest<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">You said \"two divisions or conferences.\" The doc is right to split them, and the slip proves the risk is real — <strong>Conference<\u002Fstrong> is North/South, <strong>Division<\u002Fstrong> is the team-size scoring bracket, and now <strong>Category<\u002Fstrong> is the third word that was silently absorbing both.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"9c\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">9c<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Correcting turn 8: you are a single-conference club<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr;\">\n      <div style=\"padding: 18px 20px; border-right: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">What I said in 8a<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">\"A Squad cuts across Scoring Teams, so at Races 2–4 one squad's riders sit in two different Events.\" <strong>Wrong.<\u002Fstrong> Every Scoring Team the Club spans is North, so a Squad is in exactly <em>one<\u002Fem> Event per Round. Round and Event are 1:1 <em>from inside this club<\u002Fem>, which is what you were telling me in the first place.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">But Rule 3 still stands<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">For a different reason than I gave. Not because your squad spans two Events — because <strong>the field does.<\u002Fstrong> Any view that puts North beside South has to place two Events at one x, and the season arc has to make Race 2 one point when the league published it as two. Keep the rule; replace its justification.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top: 2px solid #0d0d0d; padding: 16px 20px; font-size: 15px; line-height: 1.55; background: #faf9f4;\"><strong>Twice wrong on the same axis, and worth saying why:<\u002Fstrong> both times I reasoned from the shape of the data instead of asking who the club actually is. The load-bearing fact — <em>one club, one conference, always North<\u002Fem> — isn't in <code style=\"background: #e7e7e7; padding: 1px 4px;\">CONTEXT.md<\u002Fcode> or the README. It should be, because it changes what \"the field\" means on every screen.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"9d\" style=\"border: 2px solid #FF8000; background: #405C80; color: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 16px 20px; border-bottom: 2px solid rgba(255,255,255,0.4); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px;\">9d<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Don't build the cross-conference view with Percent Back<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding: 20px; display: flex; flex-direction: column; gap: 14px;\">\n      <div style=\"font-size: 15px; line-height: 1.55;\">You said you get curious about the other conference as State approaches. The obvious build is \"North vs. South Percent Back.\" <strong>It cannot answer the question.<\u002Fstrong> Percent Back is measured against <em>the category winner<\u002Fem> — and through Round 4 that winner is inside your own conference. So a North rider at 8% back and a South rider at 8% back are each 8% behind a <em>different<\u002Fem> person. Putting them side by side produces a number that looks comparative and isn't.<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55;\">The honest instrument is <strong>raw time on a shared course<\u002Fstrong>. Both conferences ride the same venue each Round — so it exists — but only at <strong>Race 1 and Race 5<\u002Fstrong> do they ride it on the same day, in the same conditions. Everywhere else the comparison is confounded by Saturday-versus-Sunday.<\u002Fdiv>\n      <div style=\"border-top: 2px solid rgba(255,255,255,0.4); padding-top: 14px; font-size: 15px; line-height: 1.55;\"><strong>So the pre-State question has one good answer and it's already in your hands:<\u002Fstrong> the Prologue. Same course, same day, whole league, conference-scoped categories you can lift the suffix off. Race 1 is the fair cross-conference read of the season, and it happens to be the Round you already have ingested for 2026.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"9e\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">9e<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Doc reconciliation — six edits<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column;\">\n      <div style=\"display: grid; grid-template-columns: 190px 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 13px 16px; font-size: 13px; font-weight: 700; background: #faf9f4;\"><code>CONTEXT.md<\u002Fcode> · add<\u002Fdiv>\n        <div style=\"padding: 13px 16px; font-size: 14px; line-height: 1.5; border-left: 1px solid #e7e7e7;\"><strong>Category<\u002Fstrong>, per <a href=\"#9b\">9b<\u002Fa>. Highest-value edit in the list.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 190px 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 13px 16px; font-size: 13px; font-weight: 700; background: #faf9f4;\"><code>CONTEXT.md<\u002Fcode> · add<\u002Fdiv>\n        <div style=\"padding: 13px 16px; font-size: 14px; line-height: 1.5; border-left: 1px solid #e7e7e7;\">Under <strong>Club<\u002Fstrong>: \"The Salem Composite Descenders sit entirely in the North Conference. A Club <em>may<\u002Fem> span conferences; this one does not, and the difference decides what 'the field' means on every screen.\"<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 190px 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 13px 16px; font-size: 13px; font-weight: 700; background: #faf9f4;\"><code>CONTEXT.md<\u002Fcode> · amend<\u002Fdiv>\n        <div style=\"padding: 13px 16px; font-size: 14px; line-height: 1.5; border-left: 1px solid #e7e7e7;\"><strong>Round<\u002Fstrong>: \"a race weekend in the league's numbering (Race 1–5), published as one Event per Conference — or a single Event when the whole league rides together, at the Prologue and State Champs.\" Says <em>why<\u002Fem> a Round can be two Events.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 190px 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 13px 16px; font-size: 13px; font-weight: 700; background: #faf9f4;\"><code>CONTEXT.md<\u002Fcode> · amend<\u002Fdiv>\n        <div style=\"padding: 13px 16px; font-size: 14px; line-height: 1.5; border-left: 1px solid #e7e7e7;\"><strong>Percent Back<\u002Fstrong>: strike \"and everyone in a time trial\" — the Prologue has a podium and a chip. Add: \"measured within Category, so it is <em>not<\u002Fem> comparable across Conferences.\" That second clause is the one that stops a bad chart.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 190px 1fr; border-bottom: 1px solid #e7e7e7;\">\n        <div style=\"padding: 13px 16px; font-size: 13px; font-weight: 700; background: #faf9f4;\"><code>CONTEXT.md<\u002Fcode> · soften<\u002Fdiv>\n        <div style=\"padding: 13px 16px; font-size: 14px; line-height: 1.5; border-left: 1px solid #e7e7e7;\"><strong>Event<\u002Fstrong>, <em>\"Avoid: Race\"<\u002Fem> → \"Race N is the league's published label for a Round and is fine on screen. Never say 'race' when you mean Event.\"<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 190px 1fr;\">\n        <div style=\"padding: 13px 16px; font-size: 13px; font-weight: 700; background: #faf9f4;\"><code>moments.md<\u002Fcode> · amend<\u002Fdiv>\n        <div style=\"padding: 13px 16px; font-size: 14px; line-height: 1.5; border-left: 1px solid #e7e7e7;\">M4 splits in two. <strong>M4a — the rider in her Category<\u002Fstrong>, which the athletes asked for and is the app's most-wanted view. <strong>M4b — the club against another conference<\u002Fstrong>, which is late-season, coach-only, and answerable only at Rounds 1 and 5. They are not one moment and should not share a ticket.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: #0d0d0d; margin: 8px 0 0;\"><\u002Fdiv>\n\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 8 · Vocabulary check, against the corpus<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">Your word was fine. My conclusion was wrong — Rule 3 stands.<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 900px; text-wrap: pretty;\">I told you to retire Rule 3 on the strength of an <em>if<\u002Fem>. I've now read the 2025 fixture corpus instead of assuming, and the <em>if<\u002Fem> is false. Retract that. Everything about the flow survives — and one part of it gets stronger.<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"8a\" style=\"border: 2px solid #FF8000; background: #ffffff; max-width: 1250px;\">\n    <div style=\"background: #405C80; color: #ffffff; padding: 16px 20px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n      <span style=\"font-weight: 700; font-size: 17px;\">8a<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">2025: five Rounds, eight Events<\u002Fspan>\n      <span style=\"font-size: 13px;\">source: <code style=\"background: rgba(0,0,0,0.18); padding: 1px 5px;\">fixtures/2025/configs-summary.json<\u002Fcode><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 90px 1fr 130px 1fr;\">\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d;\">Round<\u002Fdiv>\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7;\">The league's own published event name<\u002Fdiv>\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7;\">Events<\u002Fdiv>\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7;\">Consequence<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">1<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\">Race 1 — ORLeague — Old Oak Prologue<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\">1<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; color: #6e6e6e;\">whole league together<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">2<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">Race 2 — Moore Fun — <strong>South<\u002Fstrong> / <strong>North<\u002Fstrong><\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15); font-weight: 700; color: #405C80;\">2<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">split by Conference<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">3<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">Race 3 — Cascade Challenge — <strong>South<\u002Fstrong> / <strong>North<\u002Fstrong><\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15); font-weight: 700; color: #405C80;\">2<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">split by Conference<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">4<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">Race 4 — Newport Gnarnia — <strong>North<\u002Fstrong> / <strong>South<\u002Fstrong><\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15); font-weight: 700; color: #405C80;\">2<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">split by Conference<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 2px solid #0d0d0d;\">5<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7;\">Race 5 — Butte, Scoot and Boogie — <strong>State Champs<\u002Fstrong><\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7;\">1<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7; color: #6e6e6e;\">half the categories (14, not 28)<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding: 18px 20px; font-size: 15px; line-height: 1.55;\"><strong>Three of five Rounds are two Events.<\u002Fstrong> Rule 3 is not guarding an edge case — it's guarding sixty percent of the season. A URL that is an Event id splits your club in half at three of the wall's five columns, and a North rider and a South rider land at different x for the same Round. <strong>Rule 3 stands. Reinstate it as written.<\u002Fstrong><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"8b\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">8b<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">The words, audited<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 150px 1fr 1fr;\">\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d;\">Term<\u002Fdiv>\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7;\">How it got used this session<\u002Fdiv>\n      <div style=\"padding: 10px 14px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7;\">Verdict<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">Round<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\">Five per season; the wall's columns; the unit of the time axis.<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\"><strong>Correct<\u002Fstrong> — and the corpus confirms five.<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">Event<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15);\">I claimed 1:1 with Round and told you to retire Rule 3 on that basis.<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7; background: rgba(255, 128, 0, 0.15); font-weight: 700; color: #405C80;\">Wrong. 8 Events / 5 Rounds. Retracted.<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">Race<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\">You said \"a round is a race.\" The glossary says avoid the word.<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\"><strong>You were right and the glossary is over-broad.<\u002Fstrong> The league's own event names are literally \"Race 1\"…\"Race 5\" — Race N <em>is<\u002Fem> the published label of a Round.<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">Prologue<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\">Round 1; a chip-timed TT with a real podium; Percent Back works.<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\"><strong>Correct<\u002Fstrong> — it is Race 1, one Event, whole league. Also carries its own <code style=\"background: #e7e7e7; padding: 1px 4px;\">Prologue/TT Results ALL<\u002Fcode> list.<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">State Champs<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\">Treated as a fifth column, after the numbered rounds.<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\"><strong>Correct, with a nuance:<\u002Fstrong> it's <em>inside<\u002Fem> the numbering as Race 5, not outside it — and it runs 14 categories where the others run 28.<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">Conference<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\">North / South; the far side of the crossing.<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\"><strong>Correct, and load-bearing in a second way<\u002Fstrong> — Conference is the thing that splits a Round into two Events.<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #e7e7e7;\">Club · Squad · Scoring Team<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\">Used throughout for the org, the coach's grouping, and the league's label.<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e7e7e7; border-left: 1px solid #e7e7e7;\"><strong>Clean.<\u002Fstrong> No drift. Still recommend never collapsing Scoring Team into Club.<\u002Fdiv>\n\n      <div style=\"padding: 11px 14px; font-size: 14px; font-weight: 700;\">Percent Back<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-left: 1px solid #e7e7e7;\">Time-trial clause struck; Prologue is the season's baseline.<\u002Fdiv>\n      <div style=\"padding: 11px 14px; font-size: 14px; border-left: 1px solid #e7e7e7;\"><strong>Correction stands<\u002Fstrong> — it rests on chip timing and a real podium, not on Rule 3, so this survives independently.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 24px; flex-wrap: wrap; max-width: 1250px;\">\n    <div style=\"flex: 1 1 560px; border: 2px solid #FF8000; background: #405C80; color: #ffffff; padding: 22px 26px; display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Version C gets stronger, not weaker<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55;\">This is the part worth sitting with. A Squad cuts across Scoring Teams, so at Race 2, 3 and 4 <strong>one squad's riders are in two different Events<\u002Fstrong> — different fields, different winners, different Percent Back denominators. So:<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55;\">The wall's column must be a <strong>Round<\u002Fstrong> — the union of both Events — or a squad with a North and a South rider can't be one row-set. And the crossing's destination must be an <strong>Event<\u002Fstrong>: the field she actually raced is her category at <em>her<\u002Fem> Event, not at her Round.<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55; border-top: 2px solid rgba(255,255,255,0.4); padding-top: 12px;\"><strong>Which is exactly why the crossing is a link and not a scope notch.<\u002Fstrong> The wall is Round-shaped; the field is Event-shaped. A control that claimed to be the same view across that boundary would have been lying twice over. I argued for C on shape grounds — the corpus says the deeper reason is the time axis.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 380px; border: 2px solid #0d0d0d; background: #ffffff; padding: 22px 26px; display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">Two new hazards found while checking<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55;\"><strong>1 · A split Round has two fields.<\u002Fstrong> \"The club's day\" at Race 3 is two comparisons, not one. Job story 10's \"make it obvious who is included\" now has teeth at the <em>Round<\u002Fem> level, not just the club-comparison level.<\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 1.55;\"><strong>2 · The 2026 payload shape changed.<\u002Fstrong> The 2026 config carries three lists — Individual Results, By Team, Series Overall. <strong>No Team Results list at all<\u002Fstrong>, where 2025 had two plus a season overall. If that holds through the season, job story 9 has no source data this year — which independently justifies where the sequence already put it.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: #0d0d0d; margin: 8px 0 0;\"><\u002Fdiv>\n\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 32px;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 1100px;\">\n    <div style=\"font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #405C80; font-weight: 600;\">Session 7 · Landed<\u002Fdiv>\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 46px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;\">One write path in the whole product. \"Discussion\" is a shape, not a screen.<\u002Fdiv>\n    <div style=\"font-size: 17px; line-height: 1.5; max-width: 900px; text-wrap: pretty;\">That's the strongest of the five answers and it settles more than it looks like. It means the rider frame has to carry a conversation with no help — so here is that constraint written as rules you can hold a build to, and the thing it costs.<\u002Fdiv>\n    <div style=\"height: 2px; background: #0d0d0d; margin-top: 8px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"7a\" style=\"border: 2px solid #0d0d0d; background: #ffffff; max-width: 1250px;\">\n    <div style=\"padding: 14px 20px; border-bottom: 2px solid #0d0d0d; display: flex; align-items: baseline; gap: 14px;\">\n      <span style=\"font-weight: 700; font-size: 17px; color: #405C80;\">7a<\u002Fspan>\n      <span style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400;\">The rider frame has to be speakable out loud<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, 1fr);\">\n      <div style=\"padding: 18px 20px; border-right: 2px solid #0d0d0d; border-bottom: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">One measure at a time<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">A coach reading a screen to a fourteen-year-old cannot hold two axes. Percent Back <em>or<\u002Fem> starts-and-finishes in the primary position — never both competing. This is the same rule as \"never share an axis,\" moved from charts to attention.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; border-bottom: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">It has to survive being said aloud<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">The test isn't \"does it render.\" It's whether a coach can look at it and say a true sentence the rider recognises: <em>\"You were eleven percent back at the Prologue and eight at Race 3.\"<\u002Fem> If the frame needs interpreting before it can be spoken, it's a dashboard and it has failed.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; border-right: 2px solid #0d0d0d; border-bottom: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">A true sentence for the other half<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\"><em>\"You started four of four and finished three.\"<\u002Fem> Equal typographic weight to the placing sentence — not a fallback, not smaller, not below the fold. This is the acceptance test for the two-orientations principle, and it is now the only place that principle can be enforced.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; border-bottom: 1px solid #e7e7e7; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">No empty state reads as failure<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">A did-not-start is a fact about a season, not a gap in a chart. It gets a mark, a word, and no apology. The Prologue is point one of the arc, not a hole — that follows from the chip.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; border-right: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">The crossing, in one sentence<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">The red link's whole job is to let a coach finish the thought: <em>\"…and that was against forty-seven riders, not our four.\"<\u002Fem> That sentence is the reason M4 exists, and it's why the crossing hangs here rather than on a scope control.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 20px; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Nothing accumulates<\u002Fdiv>\n        <div style=\"fo
