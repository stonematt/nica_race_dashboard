m: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">M5 and M6 — the two with no representation today — become the default view rather than features. Rule 4 stops being a discipline and becomes structure: Season can't leak out of a URL because Season <em>is<\u002Fem> the URL. Season-keyed roster and Scoring Team drift are non-problems.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">M1's urgency. A Round is a paragraph competing with the whole season for attention, and M0 is an interruption to a document that has no natural slot for it.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Sunday night in October: does a coach want a season, or does she want one Round?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"2b\" style=\"width: 500px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">2b<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em;\">The Rider Board<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">Only riders are places<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">Twenty-five is a small number. Every rider you're responsible for is a card. Round, Squad, Club and field are <strong>computed views of riders<\u002Fstrong> — never destinations.<\u002Fdiv>\n      <div style=\"padding: 18px 16px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px;\">\n          <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 9px 10px; font-size: 13px;\"><strong>A. Rivera<\u002Fstrong><br><span style=\"color: #6e6e6e;\">4 starts · moving up<\u002Fspan><\u002Fdiv>\n          <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 9px 10px; font-size: 13px;\"><strong>J. Okafor<\u002Fstrong><br><span style=\"color: #6e6e6e;\">2 of 3 · finishing<\u002Fspan><\u002Fdiv>\n          <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 9px 10px; font-size: 13px;\"><strong>M. Chen<\u002Fstrong><br><span style=\"color: #6e6e6e;\">5 starts · MS, no team result<\u002Fspan><\u002Fdiv>\n          <div style=\"border: 2px dashed #6e6e6e; padding: 9px 10px; font-size: 13px; color: #6e6e6e;\">+22 more<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; color: #6e6e6e; padding-left: 2px;\">a Round is a filter on the board · the field is a card's context strip<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">M2, and the conversation the whole product exists for. Both orientations get served per-card rather than per-view — Rivera's card leads with place, Okafor's with starts, and no filter was needed. Did-not-start is on the card, not derived.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">M4. The field is hundreds of riders and cards stop at your own, so club-vs-conference has to be built in a second vocabulary anyway. M0 is off-board by definition.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Does 25 stay 25? A card board is a shape that dies quietly at 60 riders.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"2c\" style=\"width: 500px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">2c<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em;\">The Grid Itself<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">The model is the navigation<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">The who-by-when table isn't a diagram behind the app. It <strong>is<\u002Fstrong> the app. You land on the grid and pick a cell. \"One axis at a time\" becomes literal — two arrow keys.<\u002Fdiv>\n      <div style=\"padding: 18px 16px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"display: grid; grid-template-columns: 96px 1fr 1fr 1fr; border: 2px solid #0d0d0d; background: #ffffff; font-size: 12px;\">\n          <div style=\"padding: 7px 8px; background: #e7e7e7; border-bottom: 2px solid #0d0d0d;\"><\u002Fdiv>\n          <div style=\"padding: 7px 8px; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7; text-transform: uppercase; letter-spacing: 0.06em;\">Round<\u002Fdiv>\n          <div style=\"padding: 7px 8px; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7; text-transform: uppercase; letter-spacing: 0.06em;\">Season<\u002Fdiv>\n          <div style=\"padding: 7px 8px; background: #e7e7e7; border-bottom: 2px solid #0d0d0d; border-left: 1px solid #e7e7e7; text-transform: uppercase; letter-spacing: 0.06em;\">Career<\u002Fdiv>\n          <div style=\"padding: 7px 8px; font-weight: 600;\">Conference<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7;\">field<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7;\">standings<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7; opacity: 0.35;\">—<\u002Fdiv>\n          <div style=\"padding: 7px 8px; font-weight: 600;\">Club<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7;\">the day<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7;\">the arc<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7; opacity: 0.35;\">—<\u002Fdiv>\n          <div style=\"padding: 7px 8px; font-weight: 600;\">Squad<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7; background: #405C80; color: #ffffff; font-weight: 600;\">you are here<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7;\">the arc<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7; opacity: 0.35;\">—<\u002Fdiv>\n          <div style=\"padding: 7px 8px; font-weight: 600;\">Rider<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7;\">the ride<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7;\">progression<\u002Fdiv><div style=\"padding: 7px 8px; border-left: 1px solid #e7e7e7;\">career<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; color: #6e6e6e; padding-left: 2px;\">↑ step out of the club tree · the crossing is the top row<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Rule 2, visibly and unarguably. The crossing finally has a representation: it's a step up the who axis, and you can <em>see<\u002Fem> the tree boundary you're stepping over. Nothing is unreachable and every moment has an address. Back-path is the grid.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">It asks the coach to hold your model. The Assistant's ten seconds get spent choosing, and it flatters the data shape over the job — most cells are not a question anyone actually has.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Will a volunteer coach learn a two-axis vocabulary to find out how their kid did?<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"2d\" style=\"width: 500px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">2d<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em;\">The Question List<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">The moment is the spine<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">The seven moments, in the coach's own words, as the home page. Structure hides entirely behind phrasing; each sentence resolves to a view with both axes already set.<\u002Fdiv>\n      <div style=\"padding: 18px 16px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff;\">\n          <div style=\"padding: 10px 12px; border-bottom: 1px solid #e7e7e7; font-size: 15px; font-weight: 600; color: #405C80;\">What happened?<\u002Fdiv>\n          <div style=\"padding: 10px 12px; border-bottom: 1px solid #e7e7e7; font-size: 15px;\">Is this kid moving?<\u002Fdiv>\n          <div style=\"padding: 10px 12px; border-bottom: 1px solid #e7e7e7; font-size: 15px;\">How is my group?<\u002Fdiv>\n          <div style=\"padding: 10px 12px; border-bottom: 1px solid #e7e7e7; font-size: 15px;\">Were we good, or was the field weak?<\u002Fdiv>\n          <div style=\"padding: 10px 12px; border-bottom: 1px solid #e7e7e7; font-size: 15px;\">Where is this season going?<\u002Fdiv>\n          <div style=\"padding: 10px 12px; font-size: 15px;\">Who is this, and have I seen them before?<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; color: #6e6e6e; padding-left: 2px;\">the persona cut is just which sentences you can see<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Onboarding goes to zero, which for ~20 volunteer coaches may be the whole ballgame. M4 and M5 stop being buried three levels down, because the entry is a question rather than a coordinate. Persona = a visibility list, not a build.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">The second visit, and composition. \"Is this kid moving <em>against the field<\u002Fem>\" needs its own sentence, so the list grows multiplicatively — and a menu of sentences is slower than a place once you know the app.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; background: #faf9f4;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Is anyone here a power user? 20 coaches, 12 weeks a year — maybe nobody ever gets past first visit, and sentences never stop being right.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"2e\" style=\"width: 500px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #0d0d0d; color: #ffffff; font-weight: 700; font-size: 17px; padding: 12px 16px; display: flex; align-items: center;\">2e<\u002Fdiv>\n        <div style=\"padding: 10px 16px; display: flex; flex-direction: column; gap: 1px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em;\">No Home<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">Arrival, not navigation<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">Taking your own words literally: <em>their moment arrives on an ingest, not a navigation.<\u002Fem> Then the front door is a link from outside, and there is no landing page to design at all.<\u002Fdiv>\n      <div style=\"padding: 18px 16px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"border: 2px dashed #6e6e6e; padding: 10px 12px; font-size: 13px; color: #0d0d0d;\">mail / Outspoke: \"Round 3 is up\"<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; padding-left: 4px;\"><div style=\"width: 2px; height: 22px; background: #0d0d0d;\"><\u002Fdiv><div style=\"font-size: 12px; color: #6e6e6e;\">deep link, already scoped to you<\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 2px solid #FF8000; background: #ffffff; padding: 11px 12px; font-size: 14px; font-weight: 600;\">/2026/round-3/squad/wolf-pack<\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff; padding: 11px 12px; font-size: 13px;\"><strong>Root URL<\u002Fstrong> → redirect to the most recent thing that changed for you<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #6e6e6e; padding-left: 2px;\">the design job is the arrival state and the way back out — not a home<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">The done-condition, exactly. Nobody navigates; the Assistant's ten seconds are spent reading, not orienting. The write moment arrives as a link and disappears when drained. And the home-page argument never has to be won.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #e7e7e7;\"><div style=\"width: 78px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.5;\">Everything unprompted — M2 when a rider asks on a Tuesday, M4 curiosity, all of M6. And the notification ch r than an object, so you end up building a Round-shaped read on top anyway. And M0 has nowhere to live: an unmapped plate is by definition not a row on the wall.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; padding: 14px 18px; background: #faf9f4;\">\n          <div style=\"width: 86px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">Can a wall of marks answer \"what happened?\" in ten seconds for the Assistant Coach — or does a grid of 25 × 5 read as homework?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"1c\" style=\"width: 620px; display: flex; flex-direction: column; border: 2px solid #0d0d0d; background: #ffffff;\">\n      <div style=\"display: flex; align-items: stretch; border-bottom: 2px solid #0d0d0d;\">\n        <div style=\"background: #FF8000; color: #0d0d0d; font-weight: 700; font-size: 18px; padding: 14px 18px; display: flex; align-items: center;\">1c<\u002Fdiv>\n        <div style=\"padding: 12px 18px; display: flex; flex-direction: column; gap: 2px; justify-content: center;\">\n          <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 24px; font-weight: 400; letter-spacing: -0.01em;\">The Work Desk<\u002Fdiv>\n          <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6e6e6e;\">The job is the spine<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 18px; font-size: 15px; line-height: 1.5; border-bottom: 2px solid #0d0d0d;\">You land on what needs you, scoped to the riders you're responsible for. Not a tree — a short ranked list. The three people are one surface at three <strong>depths<\u002Fstrong>.<\u002Fdiv>\n\n      <div style=\"padding: 24px 18px; background: #faf9f4; border-bottom: 2px solid #0d0d0d; display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6e6e6e;\">Landing<\u002Fdiv>\n        <div style=\"border: 2px solid #0d0d0d; background: #ffffff;\">\n          <div style=\"padding: 8px 12px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; border-bottom: 2px solid #0d0d0d; background: #e7e7e7; display: flex; justify-content: space-between;\"><span>Your desk · Squad Leader<\u002Fspan><span style=\"color: #6e6e6e;\">Season 2026<\u002Fspan><\u002Fdiv>\n          <div style=\"padding: 11px 12px; border-bottom: 1px solid #e7e7e7; display: flex; gap: 12px; align-items: baseline;\">\n            <span style=\"flex: none; font-size: 10px; letter-spacing: 0.1em; padding: 3px 6px; background: #FF8000; color: #0d0d0d; font-weight: 700;\">WRITE<\u002Fspan>\n            <span style=\"font-size: 14px; line-height: 1.4;\">2 plates on your Scoring Team from Round 3 aren't attached to a Rider<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 11px 12px; border-bottom: 1px solid #e7e7e7; display: flex; gap: 12px; align-items: baseline;\">\n            <span style=\"flex: none; font-size: 10px; letter-spacing: 0.1em; padding: 3px 6px; border: 1px solid #0d0d0d; font-weight: 700;\">READ<\u002Fspan>\n            <span style=\"font-size: 14px; line-height: 1.4;\">Round 3 posted — your squad's day is ready<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 11px 12px; display: flex; gap: 12px; align-items: baseline;\">\n            <span style=\"flex: none; font-size: 10px; letter-spacing: 0.1em; padding: 3px 6px; border: 1px solid #6e6e6e; color: #6e6e6e; font-weight: 700;\">NOTICE<\u002Fspan>\n            <span style=\"font-size: 14px; line-height: 1.4;\">J. Okafor has 2 starts of 3 Rounds<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 10px; padding-left: 4px;\">\n          <div style=\"width: 2px; height: 26px; background: #0d0d0d;\"><\u002Fdiv>\n          <div style=\"font-size: 13px; color: #6e6e6e;\">every item opens a view · every view sits on one breadcrumb<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border: 2px solid #FF8000; background: #ffffff; padding: 12px; font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;\">\n          <span style=\"font-weight: 600;\">Season 2026<\u002Fspan><span style=\"opacity: 0.4;\">/<\u002Fspan><span style=\"font-weight: 600;\">Wolf Pack<\u002Fspan><span style=\"opacity: 0.4;\">/<\u002Fspan><span style=\"font-weight: 600;\">Round 3<\u002Fspan><span style=\"margin-left: auto; font-size: 12px; color: #405C80; font-weight: 600;\">cross to field ▸<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 10px; margin-top: 4px;\">\n          <div style=\"flex: 1; border: 2px solid #0d0d0d; background: #ffffff; padding: 10px; font-size: 13px; line-height: 1.4;\"><strong>Head<\u002Fstrong><br><span style=\"color: #6e6e6e;\">club-wide items, ingest first<\u002Fspan><\u002Fdiv>\n          <div style=\"flex: 1; border: 2px solid #0d0d0d; background: #ffffff; padding: 10px; font-size: 13px; line-height: 1.4;\"><strong>Squad Leader<\u002Fstrong><br><span style=\"color: #6e6e6e;\">same items, own riders only<\u002Fspan><\u002Fdiv>\n          <div style=\"flex: 1; border: 2px solid #0d0d0d; background: #ffffff; padding: 10px; font-size: 13px; line-height: 1.4;\"><strong>Assistant<\u002Fstrong><br><span style=\"color: #6e6e6e;\">READ items only<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"display: flex; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #e7e7e7;\">\n          <div style=\"width: 86px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #405C80;\">Cheap<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">M0, properly: the write moment is an item, not a place, and it <em>fans out<\u002Fem> — the Head Coach's queue can be sliced to Scoring Team so the Squad Leader recognises their own riders. The Assistant's ten seconds. And the persona cut collapses into one surface.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #e7e7e7;\">\n          <div style=\"width: 86px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Expensive<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">Curiosity. A coach who wants nothing in particular has nowhere to go, which is most of M4 and M5. Worse: the desk has to <em>generate<\u002Fem> items, and \"flat for three Rounds\" is a judgement — the closest any of these shapes comes to adjudication.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; padding: 14px 18px; background: #faf9f4;\">\n          <div style=\"width: 86px; flex: none; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\">Kills it<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.5;\">25 riders, 5 Rounds, one Club. Is there ever enough work to fill a desk? If it's empty nine weeks in twelve, it was a banner, not a home.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid #0d0d0d; background: #405C80; color: #ffffff; padding: 26px 28px; display: flex; flex-direction: column; gap: 18px; max-width: 1268px;\">\n    <div style=\"font-family: 'Anton', 'Oswald', Impact, sans-serif; font-size: 28px; font-weight: 400; letter-spacing: -0.01em;\">Two things I'd push back on before we pick a spine<\u002Fdiv>\n    <div style=\"display: flex; gap: 28px; flex-wrap: wrap;\">\n      <div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;\">Rule 3 vs. the crossing<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">Round is the right unit of <em>time<\u002Fem>. But the crossing doesn't land on a Round — the field a rider actually raced against is an Event <em>and<\u002Fem> a category. So the most important move in the app terminates on something Rule 3 says can't be a URL. Two ways out, and they're different products: keep Round as the only navigable place and render the field as a <em>disclosure inside<\u002Fem> it, or admit a second, non-time-shaped route for \"the field.\" Today's code routes on <code style=\"background: rgba(0,0,0,0.18); padding: 1px 5px;\">[eventId]<\u002Fcode> — so this is already load-bearing.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;\">\"Discussion\" is three different products<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55;\">My read: it isn't a thread. Three candidates, and only one of them is yours. <strong>(a)<\u002Fstrong> Nothing is written — the rider view <em>is<\u002Fem> the conversation prop, and the design job is making one screen speakable out loud. <strong>(b)<\u002Fstrong> A note pinned to a Rider at a Round — a coaching observation beside the result, private to staff. <strong>(c)<\u002Fstrong> A read-mark — \"I've seen this,\" so the Head Coach knows the squad leader looked. (b) is squarely analytics; (a) is a shape constraint, not a surface; (c) is Outspoke wearing a disguise.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
